name: Build

# Cada sistema se compila en su propia máquina: es la única forma fiable de
# generar dmg, nsis y AppImage/deb sin trucos de wine.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            script: dist:mac
          - os: windows-latest
            script: dist:win
          - os: ubuntu-latest
            script: dist:linux

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # ffmpeg-static descarga su binario de GitHub Releases durante el
      # postinstall y esa descarga corta a menudo (ECONNRESET).
      - name: Instalar dependencias
        shell: bash
        run: |
          for intento in 1 2 3; do
            npm ci && exit 0
            echo "npm ci falló (intento $intento); reintentando en 15 s…"
            rm -rf node_modules
            sleep 15
          done
          exit 1

      - run: npm test

      # --publish never: la release la crea el job siguiente con todos los
      # instaladores juntos, en vez de que cada máquina compita por crearla.
      - name: Compilar instaladores
        run: npm run ${{ matrix.script }} -- --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: livebridge-${{ matrix.os }}
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.exe
            dist/*.AppImage
            dist/*.deb
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artefactos

      - name: Publicar la release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          find artefactos -type f | sort
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "LiveBridge $GITHUB_REF_NAME" \
            --notes "Instaladores para macOS, Windows y Ubuntu.

          **Sin firmar**: macOS pedirá abrirlo desde el menú contextual con *Abrir*, y Windows mostrará el aviso de SmartScreen (*Más información › Ejecutar de todas formas*).

          | Sistema | Archivo |
          |---------|---------|
          | macOS (Apple Silicon / Intel) | \`.dmg\` |
          | Windows | \`.exe\` (instalador o portable) |
          | Ubuntu | \`.AppImage\` o \`.deb\` |" \
            artefactos/*/*
